name: Stone Ridge
description: 'Stone Ridge (Stone Ridge Asset Management) is an alternative asset manager
  founded in 2012 that manages approximately $35 billion across "True Alternatives" —
  investment strategies designed to be uncorrelated with traditional stocks and bonds —
  including reinsurance, energy, alternative lending, single-family rentals, opportunistic
  credit, art, LifeX longevity income, and bitcoin. It is the parent of the digital-asset
  firm NYDIG and is backed by Ribbit Capital. Stone Ridge serves institutional investors,
  wealth professionals, and insurance companies and operates a private, authenticated
  investor/client portal (connect.stoneridgeam.com) rather than a public developer API.
  As of this enrichment pass no public API, SDK, OpenAPI, or developer documentation
  surface was found for the firm.'
